[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-test-platform-mcp"
version = "0.1.0"
description = "MCP server exposing AI test platform capabilities."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.0,<1.0.0",
  "mcp>=1.6.0,<2.0.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.0,<9.0.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
